services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pdcm
      POSTGRES_USER: pdcm
      POSTGRES_PASSWORD: pdcm
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdcm -d pdcm"]
      interval: 5s
      timeout: 5s
      retries: 10
