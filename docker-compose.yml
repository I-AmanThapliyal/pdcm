services:
  postgres:
    image: postgres:16
    container_name: pdcm-postgres
    environment:
      POSTGRES_DB: pdcm
      POSTGRES_USER: pdcm
      POSTGRES_PASSWORD: pdcm
      TZ: UTC
      PGTZ: UTC
    ports:
      # Host 5433 avoids conflict with a local Windows PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - pdcm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdcm -d pdcm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pdcm_pg_data:
